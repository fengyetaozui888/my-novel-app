<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色 === */
      --color-primary:              #e8587a;
      --color-primary-container:    #fce4ec;
      --color-on-primary:           #ffffff;
      /* === 背景 / 表面 === */
      --color-background:                 #f8f5f2;
      --color-surface-container-lowest:   #ffffff;
      --color-surface:                    #fdf9f6;
      --color-surface-container:          #f0ebe7;
      --color-surface-container-high:     #e8e2dd;
      --color-surface-container-highest:  #dfd8d3;
      /* === 文字 === */
      --color-on-surface:           #2d2233;
      --color-on-surface-variant:   #9e8e92;
      /* === 功能色 === */
      --color-success:  #22c55e;
      --color-error:    #ef4444;
      --color-warning:  #f59e0b;
      /* === 边框 === */
      --color-outline:          #d4c5c9;
      --color-outline-variant:  #e8dfe2;
      /* === 圆角 === */
      --radius-sm:   0.375rem;
      --radius-md:   0.5rem;
      --radius-lg:   0.75rem;
      --radius-xl:   1rem;
      --radius-2xl:  1.25rem;
      --radius-full: 9999px;
      /* === 阴影 === */
      --shadow-card:   0 4px 12px rgba(45,34,51,0.10);
      --shadow-float:  0 10px 25px rgba(45,34,51,0.10);
      --shadow-dialog: 0 25px 50px rgba(45,34,51,0.15);
      /* === 字体 === */
      --font-sans: system-ui, -apple-system, sans-serif;
    }
  </style>

  <style>
    body {
      min-height: max(812px, 100dvh);
      font-family: system-ui, sans-serif;
    }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-background text-on-surface font-sans">

  <!-- 顶部 Header（二级页） -->
  <header class="bg-background sticky top-0 z-40 h-14 flex items-center justify-between px-4">
    <button id="btn-back" class="w-10 h-10 flex items-center justify-center text-on-surface-variant rounded-full hover:bg-surface-container active:bg-surface-container-high transition-colors" aria-label="返回">
      <i data-lucide="arrow-left" class="w-5 h-5"></i>
    </button>
    <h1 class="text-base font-semibold text-on-surface">世界信息</h1>
    <div class="w-10 h-10"></div>
  </header>

  <main class="pb-[env(safe-area-inset-bottom)]">

    <!-- 提示语卡片 -->
    <div class="mx-4 mt-4 mb-5 bg-primary-container rounded-xl p-4 flex items-start gap-3">
      <i data-lucide="sparkles" class="w-5 h-5 text-primary shrink-0 mt-0.5"></i>
      <p class="text-sm text-primary leading-relaxed font-medium">世界信息越完善，生成的内容就越真实哦~</p>
    </div>

    <!-- 分区标题：古代设定 -->
    <div class="flex items-center gap-3 px-4 pt-1 pb-3">
      <div class="h-px flex-1 bg-outline-variant/30"></div>
      <span class="text-xs font-semibold text-on-surface-variant tracking-widest">古代 · 仙侠世界</span>
      <div class="h-px flex-1 bg-outline-variant/30"></div>
    </div>

    <!-- 结构化字段区域 -->
    <div class="px-4 space-y-3">

      <!-- 列表-字段1：势力分布 -->
      <div class="bg-surface-container rounded-xl" id="card-forces">
        <div class="flex items-center justify-between px-4 py-3.5 cursor-pointer card-header" id="header-forces">
          <span class="text-base font-semibold text-on-surface">势力分布</span>
          <i data-lucide="chevron-down" class="w-5 h-5 text-on-surface-variant transition-transform duration-200" id="icon-forces"></i>
        </div>
        <div class="px-4 pb-4" id="body-forces">
          <textarea class="w-full bg-surface-container-highest border-none rounded-xl px-4 py-3 text-sm text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary/30 transition-colors resize-none" rows="3" placeholder="如：青云门、天魔教、散修联盟...">青云门、天魔教、散修联盟、万兽山脉妖族</textarea>
        </div>
      </div>

      <!-- 列表-字段2：修炼体系 -->
      <div class="bg-surface-container rounded-xl" id="card-cultivation">
        <div class="flex items-center justify-between px-4 py-3.5 cursor-pointer card-header" id="header-cultivation">
          <span class="text-base font-semibold text-on-surface">修炼体系</span>
          <i data-lucide="chevron-down" class="w-5 h-5 text-on-surface-variant transition-transform duration-200" id="icon-cultivation"></i>
        </div>
        <div class="px-4 pb-4" id="body-cultivation">
          <textarea class="w-full bg-surface-container-highest border-none rounded-xl px-4 py-3 text-sm text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary/30 transition-colors resize-none" rows="3" placeholder="如：炼气→筑基→金丹→元婴→化神...">炼气→筑基→金丹→元婴→化神→大乘→渡劫</textarea>
        </div>
      </div>

      <!-- 列表-字段3：秘境举例 -->
      <div class="bg-surface-container rounded-xl" id="card-realms">
        <div class="flex items-center justify-between px-4 py-3.5 cursor-pointer card-header" id="header-realms">
          <span class="text-base font-semibold text-on-surface">秘境举例</span>
          <i data-lucide="chevron-down" class="w-5 h-5 text-on-surface-variant transition-transform duration-200" id="icon-realms"></i>
        </div>
        <div class="px-4 pb-4" id="body-realms">
          <textarea class="w-full bg-surface-container-highest border-none rounded-xl px-4 py-3 text-sm text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary/30 transition-colors resize-none" rows="3" placeholder="如：每月朔月开启的幽冥秘境...">每月朔月开启的幽冥秘境、百年一现的天池秘境、上古大能遗留的洞府秘境</textarea>
        </div>
      </div>

      <!-- 列表-字段4：地图层次 -->
      <div class="bg-surface-container rounded-xl" id="card-maps">
        <div class="flex items-center justify-between px-4 py-3.5 cursor-pointer card-header" id="header-maps">
          <span class="text-base font-semibold text-on-surface">地图层次</span>
          <i data-lucide="chevron-down" class="w-5 h-5 text-on-surface-variant transition-transform duration-200" id="icon-maps"></i>
        </div>
        <div class="px-4 pb-4" id="body-maps">
          <textarea class="w-full bg-surface-container-highest border-none rounded-xl px-4 py-3 text-sm text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary/30 transition-colors resize-none" rows="3" placeholder="如：凡人界→修真界→仙界...">凡人界→修真界→仙界→神界</textarea>
        </div>
      </div>

    </div>

    <!-- 分区标题：通用设定 -->
    <div class="flex items-center gap-3 px-4 pt-6 pb-3">
      <div class="h-px flex-1 bg-outline-variant/30"></div>
      <span class="text-xs font-semibold text-on-surface-variant tracking-widest">通用设定</span>
      <div class="h-px flex-1 bg-outline-variant/30"></div>
    </div>

    <div class="px-4 space-y-3">

      <!-- 列表-字段5：世界友好度 -->
      <div class="bg-surface-container rounded-xl" id="card-friendliness">
        <div class="flex items-center justify-between px-4 py-3.5 cursor-pointer card-header" id="header-friendliness">
          <div class="flex items-center gap-2">
            <span class="text-base font-semibold text-on-surface">世界友好度</span>
            <button id="btn-help-friendliness" class="w-6 h-6 rounded-full bg-primary/15 flex items-center justify-center hover:bg-primary/25 active:bg-primary/30 transition-colors" aria-label="查看说明">
              <i data-lucide="help-circle" class="w-3.5 h-3.5 text-primary"></i>
            </button>
          </div>
          <i data-lucide="chevron-down" class="w-5 h-5 text-on-surface-variant transition-transform duration-200" id="icon-friendliness"></i>
        </div>
        <div class="px-4 pb-4" id="body-friendliness">
          <textarea class="w-full bg-surface-container-highest border-none rounded-xl px-4 py-3 text-sm text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary/30 transition-colors resize-none" rows="3" placeholder="描述这个世界的整体氛围与规则...">整体以弱肉强食为主，但各宗门内部讲究师门情谊，散修之间亦有互助之风</textarea>
        </div>
      </div>

      <!-- 列表-字段6：其他 -->
      <div class="bg-surface-container rounded-xl" id="card-other">
        <div class="flex items-center justify-between px-4 py-3.5 cursor-pointer card-header" id="header-other">
          <span class="text-base font-semibold text-on-surface">其他</span>
          <i data-lucide="chevron-down" class="w-5 h-5 text-on-surface-variant transition-transform duration-200" id="icon-other"></i>
        </div>
        <div class="px-4 pb-4" id="body-other">
          <textarea class="w-full bg-surface-container-highest border-none rounded-xl px-4 py-3 text-sm text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary/30 transition-colors resize-none" rows="3" placeholder="补充任何我们未涵盖的设定...">天道规则：渡劫失败则形神俱灭，无轮回之说</textarea>
        </div>
      </div>

    </div>

    <!-- 保存按钮 -->
    <div class="mx-4 mt-8 mb-6">
      <button id="btn-save" class="w-full bg-primary text-on-primary py-3.5 rounded-xl text-base font-semibold hover:opacity-90 active:scale-[0.98] transition-all inline-flex items-center justify-center gap-2">
        <i data-lucide="check" class="w-5 h-5"></i>保存
      </button>
    </div>

  </main>

  <!-- 弹窗：世界友好度说明 -->
  <div id="modal-friendliness" class="fixed inset-0 bg-black/50 z-50 flex items-end hidden">
    <div class="bg-surface rounded-t-2xl w-full max-h-[80vh] overflow-y-auto p-6 pb-[calc(1.5rem+env(safe-area-inset-bottom))]">
      <div class="flex items-center justify-between mb-5">
        <h2 class="text-lg font-bold text-on-surface">世界友好度说明</h2>
        <button id="btn-close-modal" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-surface-container active:bg-surface-container-high transition-colors" aria-label="关闭">
          <i data-lucide="x" class="w-5 h-5 text-on-surface-variant"></i>
        </button>
      </div>
      <div class="text-sm text-on-surface leading-relaxed">
        <p class="mb-4">世界友好度，是指这个世界中不同群体之间的相处模式与生存法则。</p>
        <p class="font-semibold text-on-surface mb-3">例如：</p>
        <div class="space-y-3">
          <!-- 说明项1 -->
          <div class="flex gap-2.5">
            <span class="text-primary font-bold shrink-0">•</span>
            <p class="leading-relaxed"><strong class="text-on-surface">弱肉强食型</strong>：如修仙界、末世，实力为尊，弱者在夹缝中求生</p>
          </div>
          <!-- 说明项2 -->
          <div class="flex gap-2.5">
            <span class="text-primary font-bold shrink-0">•</span>
            <p class="leading-relaxed"><strong class="text-on-surface">表面和谐型</strong>：如现代星际，多势力共治，法律完善，罪恶只在暗面涌动</p>
          </div>
          <!-- 说明项3 -->
          <div class="flex gap-2.5">
            <span class="text-primary font-bold shrink-0">•</span>
            <p class="leading-relaxed"><strong class="text-on-surface">阶层分化型</strong>：如赛博朋克，高科技与低生活并存，上城与下城泾渭分明</p>
          </div>
          <!-- 说明项4 -->
          <div class="flex gap-2.5">
            <span class="text-primary font-bold shrink-0">•</span>
            <p class="leading-relaxed"><strong class="text-on-surface">温暖治愈型</strong>：如童话世界，善意是通行的货币，互助是生存的法则</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    $(function() {
      // === 导航函数 ===
      function navPush(route) {
        console.log('[原型演示] PUSH 到: ' + route);
        window.location.href = route;
      }
      function navReplace(route) {
        console.log('[原型演示] REPLACE 为: ' + route);
        window.location.replace(route);
      }
      function navReset(route) {
        console.log('[原型演示] RESET 到: ' + route);
        window.location.href = route;
      }
      function navBack() {
        console.log('[原型演示] BACK 返回上一页');
        if (window.history.length > 1) window.history.back();
      }

      // === 返回按钮 ===
      $('#btn-back').on('click', function() {
        navBack();
      });

      // === 可展开卡片：点击标题栏切换展开/收起 ===
      // 1. 切换对应 body 区域的 hidden 类
      // 2. 旋转 chevron 图标 180°
      $('.card-header').on('click', function() {
        var fieldId = this.id.replace('header-', '');
        $('#body-' + fieldId).toggleClass('hidden');
        $('#icon-' + fieldId).toggleClass('rotate-180');
      });

      // === 世界友好度说明弹窗 ===
      // 点击问号图标打开弹窗（阻止冒泡，不触发卡片收起）
      $('#btn-help-friendliness').on('click', function(e) {
        e.stopPropagation();
        $('#modal-friendliness').removeClass('hidden');
      });

      // 关闭弹窗
      $('#btn-close-modal').on('click', function() {
        $('#modal-friendliness').addClass('hidden');
      });

      // 点击弹窗背景关闭
      $('#modal-friendliness').on('click', function(e) {
        if (e.target === this) {
          $(this).addClass('hidden');
        }
      });

      // === 保存按钮 ===
      $('#btn-save').on('click', function() {
        console.log('[原型演示] 保存世界信息');
        navBack();
      });
    });
  </script>
  <script>lucide.createIcons();</script>
</body>

</html>
